name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      render_sos1:
        description: Render the fail-closed SOS1 interface movie and upload its evidence bundle
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build production bundle
        run: |
          node scripts/version-web-code.test.mjs
          npm run build:web
          node scripts/social-preview.test.mjs --dist
      - name: Check submitted manuscript integrity and tamper rejection
        run: npm run test:paper-submission
      - name: Preserve production bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: molarium-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 3

  scientific:
    name: Scientific validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run scientific validation suite
        run: npm run test:ci:scientific
      - name: Check folding requests, chemical mapping and pinned upstream sources
        run: node --test folding/integration.test.mjs folding/library.test.mjs folding/comparison/*.test.mjs
      - name: Check all seven frozen SOS1 graphs through strict 2D depiction
        run: npm run test:depiction-hydrogens
      - name: Check simulation benchmark acceptance logic and parameter import
        run: npm run test:simulation-benchmarks
      - name: Check Design finding regressions, option help, and preserved baseline evidence
        run: npm run test:design-validation
      - name: Check explicit SOS1 contact revision against the immutable source
        run: node design-history/sos1-recompute-revision.test.mjs

  cofold-analysis:
    name: Cofolding comparison integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install isolated analysis dependencies
        run: |
          python3 -m venv /tmp/cofold-analysis
          /tmp/cofold-analysis/bin/pip install -r folding/comparison/requirements-analysis.txt
      - name: Check protein-frame metrics and native chemical identity
        run: /tmp/cofold-analysis/bin/python -m unittest discover -s folding/comparison -p 'test_*.py'

  browser:
    name: Browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run browser integration suite
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:ci:browser
      - name: Check accessible option help and unchanged molecular settings
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:design-help-browser
      - name: Check folding controls and local-only boundary
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: bun scripts/localfold-ui.browser.test.mjs
      - name: Check local Foldarium pose review, decisions and portable export
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          MOLARIUM_LIBRARY_REUSE: reviews/library-cofolding-2026-11-12/standard/library-1.json
        run: bun scripts/cofold-library.browser.mjs
      - name: Check method-labelled browser/native comparison review
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          MOLARIUM_LIBRARY_REUSE: reviews/cofold-method-comparison-2026-11-12/boltz2-browser-native.library.json
        run: bun scripts/cofold-library.browser.mjs
      - name: Check numerical-only public validation panel and evidence links
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: bun validation/dashboard.browser.test.mjs
      - name: Check final SOS1 contact failure and explicit release through public actions
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: bun scripts/sos1-final-contact.browser.test.mjs
      - name: Check unprepared protein calculation notice and prepared controls
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node --test calculation-readiness.test.mjs
          node --test scripts/stale-polish.test.mjs
          bun scripts/unprepared-protein.browser.test.mjs
          bun scripts/preparation-button.browser.test.mjs
          bun scripts/version-web-code.browser.test.mjs
          MOLARIUM_TEST_API=1 bun scripts/calculation-readiness.browser.test.mjs
      - name: Check minimization reuse in the release bundle
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          npm run build:web
          bun scripts/readiness-release.browser.test.mjs

  local-lab:
    name: Local Lab network and integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check committed manifest without regenerating it
        run: npm run manifest:local:check
      - name: Check local server exposure and startup failure handling
        run: npm run test:server-security
      - name: Check database cancellation, timeouts and recovery
        run: npm run test:campaign-store
      - name: Verify privacy UI, content hashes, and blocked external canaries
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:local-lab

  worker-contracts:
    name: WebGPU worker contracts (software correctness only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Dispatch real production workers and check rejection and analytic contracts
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          MOLARIUM_HEADLESS_SOFTWARE_WEBGPU: '1'
        run: npm run test:worker-contract-browser

  render-sos1:
    name: SOS1 interface render
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.render_sos1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Verify media tools
        run: ffmpeg -version && ffprobe -version
      - name: Verify headless WebGPU adapter
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          MOLARIUM_HEADLESS_SOFTWARE_WEBGPU: '1'
        run: bun scripts/probe-headless-webgpu.mjs
      - name: Render fail-closed SOS1 interface story
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          MOLARIUM_HEADLESS_SOFTWARE_WEBGPU: '1'
        run: npm run render:designer-moves-interface
      - name: Preserve verified movie, audit, manifest, and QA frames
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sos1-interface-render-${{ github.sha }}
          path: outputs/design-history/sos1-hit-only-growth-clash-v7/interface-movie
          if-no-files-found: error
          retention-days: 7
