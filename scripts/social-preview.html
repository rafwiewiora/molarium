<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Molarium social preview artwork</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { font-family: Arial, Helvetica, sans-serif; color: #132632;
      background: linear-gradient(112deg, #ffffff 45%, #eaf7f4 100%); }
    main { height: 100%; padding: 57px 64px; border-top: 9px solid #2b9993; position: relative; }
    header { display: flex; align-items: center; justify-content: space-between; }
    .brand { font-size: 35px; font-weight: 800; letter-spacing: 3px; }
    .studio { margin-top: 7px; color: #657b87; font-size: 14px; font-weight: 700; letter-spacing: 3px; }
    .url { color: #3c6c74; font-size: 23px; }
    h1 { margin: 67px 0 22px; font-size: 63px; line-height: 1.09; letter-spacing: -2px; font-weight: 700; }
    .description { font-size: 28px; line-height: 1.45; color: #4b626f; margin: 0; }
    .mark { position: absolute; width: 255px; height: 255px; right: 65px; top: 204px; }
    footer { position: absolute; left: 64px; bottom: 51px; display: flex; align-items: center;
      gap: 18px; font-size: 21px; color: #48626e; }
    .badge { background: #e4f3ef; color: #236b64; border: 1px solid #b9ddd3;
      padding: 9px 15px; border-radius: 7px; font-size: 17px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <header><div><div class="brand">MOLARIUM</div><div class="studio">MOLECULAR STUDIO</div></div>
      <div class="url">molarium.org</div></header>
    <h1>Build, edit and<br>simulate molecules.</h1>
    <p class="description">Molecular design and simulation,<br>right in your browser.</p>
    <img class="mark" src="/mark.svg" alt="Molarium flask logo">
    <footer><span class="badge">OPEN SOURCE</span><span>For scientists and AI agents</span></footer>
  </main>
</body>
</html>
