<style>
:root{color-scheme:light;--ink:#20343d;--muted:#697a80;--teal:#087c80;--line:#dce4e3;--paper:#fff;--wash:#f4f7f5;--old:#fae6e4;--new:#ddf1e8}*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button,select,input{min-height:39px}button{border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink);padding:8px 13px;cursor:pointer}button:hover{border-color:var(--teal);background:#f1f8f5}button[aria-pressed=true],button.active{background:var(--teal);border-color:var(--teal);color:#fff}button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #bf8328;outline-offset:3px}a{color:var(--teal);text-underline-offset:3px}select{border:1px solid var(--line);border-radius:6px;background:white;padding:7px;max-width:100%}textarea{width:100%;min-height:160px;border:1px solid #b7c8c8;border-radius:7px;padding:15px;font:17px/1.65 Georgia,serif;color:var(--ink)}.top{background:#fff;border-bottom:1px solid var(--line);padding:23px 4vw 0}.brand{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:750;color:var(--teal)}.headline{display:flex;justify-content:space-between;gap:20px;align-items:center}.headline h1{font:normal 35px/1.2 Georgia,serif;margin:8px 0}.subtitle{color:var(--muted);max-width:880px;margin:8px 0 22px}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tabs{display:flex;gap:4px;overflow:auto;padding-bottom:12px}.tabs button{white-space:nowrap;border:none;background:transparent}.tabs button.active{background:#e5f1ed;color:var(--teal)}.page{max-width:1560px;margin:auto;padding:25px 4vw 50px}.notice{font-size:14px;color:#53696d;margin-bottom:18px;max-width:1120px}.notice strong{color:var(--ink)}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px}.sidebar{max-height:calc(100vh - 255px);overflow:auto;position:sticky;top:20px;align-self:start}.sidebar select{width:100%;margin-bottom:9px}.queue{display:flex;flex-direction:column;gap:5px;margin-top:12px}.queue button{display:block;text-align:left;line-height:1.35;padding:12px;border:1px solid transparent;background:transparent}.queue button.active{background:white;color:var(--ink);border-color:#abd1c9;box-shadow:inset 3px 0 var(--teal)}.queue .num{font-size:11px;font-weight:700;color:var(--teal);letter-spacing:.04em}.queue .qtitle{display:block;font-size:13px;margin-top:3px}.queue .status{display:block;font-size:11px;color:var(--muted);margin-top:4px}.review-card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:26px;min-width:0}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}h2{font:normal 27px/1.3 Georgia,serif;margin:7px 0 17px}h3{font-size:16px;margin:20px 0 8px}.meta{font-size:12px;color:var(--muted);margin:10px 0}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:24px}.side{min-width:0}.side h3{font:600 12px/1.4 -apple-system,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:0}.prose{font:17px/1.8 Georgia,"Times New Roman",serif;white-space:pre-wrap;overflow-wrap:anywhere}.prose.source{font:12px/1.65 ui-monospace,SFMono-Regular,monospace}.prose del{background:var(--old);text-decoration-color:#bd6b68}.prose ins{background:var(--new);text-decoration:none;border-bottom:1px solid #83b59b}.empty{font:italic 15px Georgia,serif;color:var(--muted)}.legend{font-size:12px;margin-bottom:16px;color:var(--muted)}.swatch{display:inline-block;width:12px;height:12px;margin-right:5px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px;padding-top:19px;border-top:1px solid var(--line)}.decision{font-size:13px;color:var(--teal);margin-top:12px}.stepper{display:flex;justify-content:space-between;gap:15px;margin-top:18px}details{margin-top:20px;border-top:1px solid var(--line);padding-top:13px}summary{cursor:pointer;color:var(--muted);font-size:13px}.context{font:15px/1.7 Georgia,serif;color:var(--muted);max-height:360px;overflow:auto;margin-top:12px;white-space:pre-wrap}.stack{display:grid;gap:22px}.badge{display:inline-block;font-size:11px;letter-spacing:.035em;padding:3px 8px;border-radius:4px;background:#eaf2ee;color:#34665c;margin-right:5px}.warning{background:#fbf0d9;color:#795a25}.figure-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.figure-grid img{width:100%;display:block;border:1px solid var(--line);cursor:zoom-in;background:white}.figure-grid figure{margin:0}.figure-grid figcaption{font-size:12px;color:var(--muted);margin:10px 0}.zoom{border:0;border-radius:12px;max-width:96vw;max-height:95vh;padding:12px}.zoom::backdrop{background:#122b35b8}.zoom img{display:block;max-width:90vw;height:auto;max-height:85vh;object-fit:contain}.zoom .tools{justify-content:flex-end;margin-bottom:8px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:11px 9px;vertical-align:top}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}code{font:12px ui-monospace,monospace;overflow-wrap:anywhere}.source-pickers{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}.source-pickers label{display:block;font-size:12px;color:var(--muted)}.source-pickers select{width:100%;margin-top:6px}.full-source{max-height:68vh;overflow:auto;font:12px/1.65 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;background:#fff;padding:18px;border:1px solid var(--line);border-radius:8px}.full-source del,.full-source ins{display:block;text-decoration:none}.full-source del{background:var(--old)}.full-source ins{background:var(--new)}.full-source .equal{color:#65777e}.suggestion-quote{font:18px/1.7 Georgia,serif;padding:12px 0}.footer{font-size:12px;color:var(--muted);margin-top:30px}.hidden{display:none!important}#status{font-size:12px;color:var(--muted)}#notice-live{font-size:13px;color:#805019;max-width:500px}.blank{padding:45px;text-align:center;color:var(--muted)}.inline-note{font-size:14px;color:var(--muted);line-height:1.7}.pill{background:#edf2ef;border-radius:6px;padding:3px 8px;font-size:12px}.countbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;gap:12px;flex-wrap:wrap}.report{white-space:pre-wrap;font:15px/1.75 Georgia,serif;max-width:1000px}.gallery-controls{margin-top:20px}.small{font-size:12px}.historysummary{max-width:1000px;font:17px/1.8 Georgia,serif}.sep{height:1px;background:var(--line);margin:22px 0}
@media(max-width:1000px){.layout{grid-template-columns:200px minmax(0,1fr);gap:18px}.comparison{grid-template-columns:1fr;gap:24px}.review-card{padding:20px}.prose{font-size:16px}.headline{align-items:flex-start}.headline h1{font-size:30px}}@media(max-width:680px){.headline{display:block}.headline .tools{margin:15px 0}.page{padding:20px 16px}.top{padding:20px 16px 0}.layout{display:block}.sidebar{position:static;max-height:240px;margin-bottom:20px}.queue{display:grid;grid-template-columns:1fr 1fr}.figure-grid,.source-pickers{grid-template-columns:1fr}.review-card,.panel{padding:18px}h2{font-size:23px}.tabs{margin-top:15px}.tools button{padding:8px 10px}}
input[type=checkbox]{min-height:0;margin:0 5px 0 0;vertical-align:middle}label:has(input[type=checkbox]){display:inline-flex;align-items:center;gap:4px}input:focus-visible{outline:3px solid #bf8328;outline-offset:3px}

<body>
<header class="top">
<div class="brand">Molarium / Editorial workspace</div>
<div class="headline"><h1>Your paper. Your decisions.</h1><div class="tools"><button id="export-review">Export decisions</button><button id="import-review">Import decisions</button><input id="import-file" type="file" accept="application/json,.json" hidden></div></div>
<p class="subtitle">Compare the recovered wording, follow the changes in context, and keep what sounds right. The current manuscript stays untouched. Every decision starts undecided.</p>
<div class="countbar"><span id="status" role="status"></span><span id="notice-live" role="status"></span></div>
<nav class="tabs" aria-label="Review sections"><button data-tab="review" class="active">All edits</button><button data-tab="suggestions">Optional suggestions</button><button data-tab="figures">Figures 1 &amp; 2</button><button data-tab="appendix">Appendix C alternatives</button><button data-tab="compare">Compare any version</button><button data-tab="history">History &amp; evidence</button><button data-tab="technical">Scientific checks</button></nav>
</header>
<main class="page" id="main"></main>
<dialog id="zoom" class="zoom"><div class="tools"><button id="close-zoom">Close image</button></div><img id="zoom-image" alt="Expanded manuscript figure"></dialog>
<script>
'use strict';
const DATA = /* REVIEW_DATA */;
const byId=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sourceHref=id=>'history-2026-09-06/artifacts/'+encodeURIComponent(id);
const identity=DATA.currentSha256+':'+DATA.comparisonBaseline;
const storageKey='molarium-paper-review:v1:'+identity+':'+DATA.dataId;
let state={schema:'molarium.manuscript-decisions/v1',identity,currentSourceSha256:DATA.currentSha256,comparisonBaseline:DATA.comparisonBaseline,reviewDataId:DATA.dataId,decisions:{},suggestions:{},figures:{},technical:{},versionNotes:[],events:[]};
let storageAvailable=true,restoreWarning='';
try{const saved=localStorage.getItem(storageKey);if(saved)state=validateImport(JSON.parse(saved));}catch(e){storageAvailable=false;restoreWarning='Saved review could not be restored safely. Nothing was accepted. Export new choices before closing; the previous saved record has not been altered.';}
let tab='review',selected='D008',area='All changes',pendingOnly=false,sourceMode=false;
const main=byId('main');
function validateImport(value){
 if(!value||value.schema!=='molarium.manuscript-decisions/v1'||value.identity!==identity||value.currentSourceSha256!==DATA.currentSha256||value.comparisonBaseline!==DATA.comparisonBaseline||value.reviewDataId!==DATA.dataId)throw Error('This review belongs to a different source snapshot. No decisions were imported.');
 const clean={...state,decisions:{},suggestions:{},figures:{},technical:{},versionNotes:[],events:[]};
 for(const [key,d] of Object.entries(value.decisions??{})){const change=DATA.changes.find(x=>x.id===key);if(!change||!d||!['current','earlier','custom','pending'].includes(d.choice)||d.before!==change.before||d.after!==change.after)throw Error('A decision does not match its original source text.');if(d.custom!=null&&typeof d.custom!=='string')throw Error('Invalid custom text.');clean.decisions[key]={choice:d.choice,before:d.before,after:d.after,custom:d.custom??'',note:String(d.note??''),updated:String(d.updated??'')};}
 for(const [key,d] of Object.entries(value.suggestions??{})){if(!DATA.suggestions.some(x=>x.id===key)||!['propose','reject','pending'].includes(d))throw Error('Unknown suggestion decision.');clean.suggestions[key]=d;}
 for(const [key,d] of Object.entries(value.figures??{})){if(!['F01','F02'].includes(key)||!['current','repository','refine','pending'].includes(d.choice))throw Error('Unknown figure decision.');clean.figures[key]={choice:d.choice,note:String(d.note??'')};}
 for(const [key,d] of Object.entries(value.technical??{})){if(!DATA.technicalFindings.some(x=>x.id===key)||!['propose','keep','discuss','pending'].includes(d.choice))throw Error('Unknown technical decision.');clean.technical[key]={choice:d.choice,note:String(d.note??'')};}
 if(!Array.isArray(value.versionNotes??[])||!Array.isArray(value.events??[]))throw Error('Invalid review history.');
 clean.versionNotes=(value.versionNotes??[]).map(x=>{if(!x||!DATA.sources.some(s=>s.id===x.left)||!DATA.sources.some(s=>s.id===x.right)||typeof x.note!=='string')throw Error('Comparison note refers to unknown sources or invalid text.');return {left:x.left,right:x.right,note:x.note,updated:String(x.updated??'')};});
 clean.events=(value.events??[]).map(x=>({kind:String(x.kind),id:String(x.id),choice:String(x.choice),time:String(x.time)}));
 return clean;
}
function save(kind,id,choice){state.events.push({kind,id,choice,time:new Date().toISOString()});try{localStorage.setItem(storageKey,JSON.stringify(state));storageAvailable=true;}catch(e){storageAvailable=false;}updateStatus();}
function updateStatus(){const n=DATA.changes.filter(x=>state.decisions[x.id]&&state.decisions[x.id].choice!=='pending').length;byId('status').textContent=n+' of '+DATA.changes.length+' source changes decided · '+(DATA.changes.length-n)+' undecided · '+(storageAvailable?'saved in this browser':'not saved persistently; export before closing');}
function announce(text){byId('notice-live').textContent=text;}
function choose(change,choice,custom){state.decisions[change.id]={choice,before:change.before,after:change.after,custom:custom??state.decisions[change.id]?.custom??'',note:byId('review-note')?.value??state.decisions[change.id]?.note??'',updated:new Date().toISOString()};save('text',change.id,choice);render();}
function tokens(text){return text.match(/\s+|[^\s]+/g)||[];}
// Bounded LCS. Every input token is emitted, even when a coarse fallback is needed.
function sequenceDiff(a,b,limit=700000){
 let p=0;while(p<a.length&&p<b.length&&a[p]===b[p])p++;
 let ae=a.length,be=b.length;while(ae>p&&be>p&&a[ae-1]===b[be-1]){ae--;be--;}
 const out=[];const push=(kind,items)=>{if(!items.length)return;if(out.at(-1)?.kind===kind)out.at(-1).items.push(...items);else out.push({kind,items:[...items]});};
 push('equal',a.slice(0,p));const n=ae-p,m=be-p;
 if(n*m>limit){push('delete',a.slice(p,ae));push('insert',b.slice(p,be));}
 else{const cols=m+1,dp=new Uint32Array((n+1)*cols);for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i*cols+j]=a[p+i]===b[p+j]?dp[(i+1)*cols+j+1]+1:Math.max(dp[(i+1)*cols+j],dp[i*cols+j+1]);let i=0,j=0;while(i<n||j<m){if(i<n&&j<m&&a[p+i]===b[p+j]){push('equal',[a[p+i++]]);j++;}else if(i<n&&(j===m||dp[(i+1)*cols+j]>=dp[i*cols+j+1]))push('delete',[a[p+i++]]);else push('insert',[b[p+j++]]);}}
 push('equal',a.slice(ae));return out;
}
function wordPanels(before,after){const pieces=sequenceDiff(tokens(before),tokens(after));return [pieces.filter(x=>x.kind!=='insert').map(x=>x.kind==='delete'?'<del>'+esc(x.items.join(''))+'</del>':esc(x.items.join(''))).join(''),pieces.filter(x=>x.kind!=='delete').map(x=>x.kind==='insert'?'<ins>'+esc(x.items.join(''))+'</ins>':esc(x.items.join(''))).join('')];}
function changeList(){const order={'Main text':0,'Appendices':1,'Preamble':2,'References':3};return DATA.changes.filter(x=>(area==='All changes'||x.area===area)&&(!pendingOnly||!state.decisions[x.id]||state.decisions[x.id].choice==='pending')).sort((a,b)=>order[a.area]-order[b.area]||a.id.localeCompare(b.id));}
function decisionName(choice){return ({current:'Keep current',earlier:'Use earlier',custom:'Custom wording',pending:'Undecided'})[choice]||'Undecided';}
function renderReview(){
 const list=changeList();if(!list.some(x=>x.id===selected))selected=list[0]?.id;
 const change=DATA.changes.find(x=>x.id===selected);
 main.innerHTML='<p class="notice"><strong>Complete comparison:</strong> all '+DATA.changes.length+' source-line changes between the recovered September 2 draft and your current Prism manuscript. This baseline is not proven to be the exact draft sent to Woody. Appendix C itself remains an archive, not an edit to accept. Nothing is preselected.</p><div class="layout"><aside class="sidebar"><label class="small" for="area">Show</label><select id="area">'+['All changes','Main text','Appendices','Preamble','References'].map(x=>'<option '+(area===x?'selected':'')+'>'+x+'</option>').join('')+'</select><label class="small"><input id="pending" type="checkbox" '+(pendingOnly?'checked':'')+'> Undecided only</label><div class="queue">'+list.map(x=>'<button data-change="'+x.id+'" class="'+(x.id===selected?'active':'')+'"><span class="num">'+x.id+' · '+esc(x.area)+'</span><span class="qtitle">'+esc(x.section)+'</span><span class="status">'+decisionName(state.decisions[x.id]?.choice)+'</span></button>').join('')+'</div></aside><section id="detail">'+(!change?'<div class="panel blank">No changes in this view. Other sections remain available in “Show”.</div>':'')+'</section></div>';
 byId('area').onchange=e=>{area=e.target.value;render();};byId('pending').onchange=e=>{pendingOnly=e.target.checked;render();};main.querySelectorAll('[data-change]').forEach(b=>b.onclick=()=>{selected=b.dataset.change;render();});if(!change)return;
 const texts=sourceMode?[change.before,change.after]:[change.beforeText,change.afterText],panels=wordPanels(...texts),d=state.decisions[change.id];
 byId('detail').innerHTML='<article class="review-card"><div class="countbar"><span class="eyebrow">'+change.id+' / '+esc(change.kind)+' / '+esc(change.recordIds.join(', '))+'</span><label class="small"><input id="source-toggle" type="checkbox" '+(sourceMode?'checked':'')+'> Exact LaTeX</label></div><h2>'+esc(change.section)+'</h2><div class="legend"><span class="swatch" style="background:var(--old)"></span>earlier wording removed &nbsp; <span class="swatch" style="background:var(--new)"></span>current wording added</div><div class="comparison"><div class="side"><h3>Recovered September 2 draft</h3><div class="prose '+(sourceMode?'source':'')+'">'+(panels[0]||'<span class="empty">No text here in the earlier version.</span>')+'</div></div><div class="side"><h3>Current Prism draft</h3><div class="prose '+(sourceMode?'source':'')+'">'+(panels[1]||'<span class="empty">This text was removed in the current version.</span>')+'</div></div></div><p class="meta">Earlier line '+change.beforeLine+' · Current comparison line '+change.afterLine+' · Reading view simplifies LaTeX; exact source remains authoritative.</p><div class="actions"><button data-decision="current">Keep current</button><button data-decision="earlier">Use earlier</button><button id="write-custom">Write my version</button><button data-decision="pending">Leave undecided</button></div><p class="decision">Decision: '+decisionName(d?.choice)+'</p><div id="custom-box" class="'+(d?.choice==='custom'?'':'hidden')+'"><label for="custom-text">Your proposed wording (plain text, not silently converted to LaTeX)</label><textarea id="custom-text">'+esc(d?.custom??change.afterText)+'</textarea><button id="save-custom">Save custom wording</button></div><details><summary>Add a note or see surrounding context</summary><label class="small" for="review-note">Your note</label><textarea id="review-note" style="min-height:80px;font-size:15px">'+esc(d?.note??'')+'</textarea><button id="save-note">Save note</button><div class="context"><strong>Before this change</strong>\n'+esc(change.contextBefore)+'\n\n<strong>After this change</strong>\n'+esc(change.contextAfter)+'</div></details>'+ (change.appendixVariants.length?'<details><summary>Additional wording recovered by Appendix C ('+change.appendixVariants.length+' versions, including current)</summary>'+change.appendixVariants.map(v=>'<h3>'+esc(v.recordId+' · '+v.label)+'</h3><p class="meta">'+esc(v.evidence.join(' '))+'</p><div class="prose source">'+esc(v.latex)+'</div>').join('')+'</details>':'')+'</article><div class="stepper"><button id="previous">← Previous change</button><span class="meta">'+(list.findIndex(x=>x.id===selected)+1)+' of '+list.length+' in this view</span><button id="next">Next change →</button></div>';
 byId('source-toggle').onchange=e=>{sourceMode=e.target.checked;render();};main.querySelectorAll('[data-decision]').forEach(b=>{b.setAttribute('aria-pressed',String(d?.choice===b.dataset.decision));b.onclick=()=>choose(change,b.dataset.decision);});byId('write-custom').onclick=()=>{byId('custom-box').classList.remove('hidden');byId('custom-text').focus();};byId('save-custom').onclick=()=>choose(change,'custom',byId('custom-text').value);byId('save-note').onclick=()=>choose(change,d?.choice??'pending');const index=list.findIndex(x=>x.id===selected);byId('previous').disabled=index===0;byId('next').disabled=index===list.length-1;byId('previous').onclick=()=>{selected=list[index-1].id;render();};byId('next').onclick=()=>{selected=list[index+1].id;render();};
}
function renderSuggestions(){main.innerHTML='<p class="notice">These are <strong>separate proposals</strong>, not changes already made by Woody and not automatic corrections. “Propose” adds an item to your decision export; it does not overwrite any accepted paragraph. Overlapping proposals will require reconciliation before a new manuscript is compiled.</p><div class="stack">'+DATA.suggestions.map(s=>'<article class="panel"><span class="badge '+(s.kind.startsWith('Optional')?'warning':'')+'">'+esc(s.kind)+'</span><span class="meta">'+s.id+' · Current source line '+s.line+'</span><div class="comparison"><div><h3>Current</h3><div class="suggestion-quote">'+esc(s.before)+'</div></div><div><h3>Optional revision</h3><div class="suggestion-quote">'+esc(s.after)+'</div></div></div><p class="inline-note">'+esc(s.reason)+'</p>'+(s.source?'<p class="meta">'+esc(s.source)+'</p>':'')+'<div class="tools">'+['propose','reject','pending'].map(c=>'<button data-suggestion="'+s.id+'" data-choice="'+c+'" aria-pressed="'+String((state.suggestions[s.id]??'pending')===c&&c!=='pending')+'">'+({propose:'Propose this change',reject:'No change',pending:'Leave undecided'})[c]+'</button>').join('')+'</div><p class="meta">Status: '+esc(state.suggestions[s.id]??'undecided')+'</p></article>').join('')+'</div>';main.querySelectorAll('[data-suggestion]').forEach(b=>b.onclick=()=>{state.suggestions[b.dataset.suggestion]=b.dataset.choice;save('suggestion',b.dataset.suggestion,b.dataset.choice);render();});}
function renderFigures(){
 const specs=[{id:'F01',title:'Figure 1 · Structural context',old:DATA.figureAssets.F01.current.path,new:DATA.figureAssets.F01.repository.path,note:'Preserve the full-interface composition and chemically registered 2D depiction. The repository image also visibly shows Connected features and a GOL component; do not adopt a caption claiming a network-locked, glycerol-excluded capture unless a matching capture is supplied. An image change and a caption change are separate decisions.'},{id:'F02',title:'Figure 2 · Designer intent and receptor response',old:DATA.figureAssets.F02.current.path,new:DATA.figureAssets.F02.repository.path,note:'The current PDF has the superseded four-panel replay. The repository has six checkpoint panels separating the inherited AWW direction, the designer-directed Tyr884 contact, and the Phe890 response. Its crystal-informed design story is not the older blinded prediction claim. Changing the figure also requires reconciling its caption and Appendix A.5; do not swap only the RMSD number.'}];
 main.innerHTML='<p class="notice">The figure pixels are shown as recovered, without redesign or molecular alteration. Click either image to enlarge. Decisions do not modify files.</p><div class="stack">'+specs.map(f=>'<article class="panel"><div class="eyebrow">'+f.id+'</div><h2>'+f.title+'</h2><div class="figure-grid"><figure><img data-zoom src="'+f.old+'" alt="'+f.title+' in the current PDF" tabindex="0"><figcaption>Current main (9).pdf · embedded image extracted without retouching</figcaption></figure><figure><img data-zoom src="'+f.new+'" alt="'+f.title+' repository version" tabindex="0"><figcaption>Repository snapshot 863aeba · preserved, not newly generated</figcaption></figure></div><p class="inline-note">'+f.note+'</p><div class="tools">'+['current','repository','refine','pending'].map(c=>'<button data-figure="'+f.id+'" data-choice="'+c+'" aria-pressed="'+String(state.figures[f.id]?.choice===c&&c!=='pending')+'">'+({current:'Keep current figure',repository:'Propose repository figure',refine:'Request refinement',pending:'Leave undecided'})[c]+'</button>').join('')+'</div><label class="small" for="note-'+f.id+'">Figure / caption note</label><textarea id="note-'+f.id+'" style="min-height:85px;font-size:15px">'+esc(state.figures[f.id]?.note??'')+'</textarea><button data-figure-note="'+f.id+'">Save figure note</button><p class="meta">Status: '+esc(state.figures[f.id]?.choice??'undecided')+'</p></article>').join('')+'</div><section class="panel gallery-controls"><h2>Other recovered figure files</h2><p class="inline-note">All archived PNG versions remain available, including older layouts. Six vector/PDF figure artifacts are also linked in History &amp; evidence. A filename does not establish when or why a figure was accepted.</p><select id="gallery" aria-label="Recovered figure file">'+DATA.history.artifacts.filter(a=>a.extension==='.png').map(a=>{const alias=DATA.history.aliases.find(x=>x.artifact===a.id);return '<option value="'+a.id+'">'+esc(alias.source)+' · '+a.sha256.slice(0,10)+'</option>';}).join('')+'</select><p><a id="gallery-link" target="_blank" rel="noopener">Open exact image</a></p></section>';
 main.querySelectorAll('[data-zoom]').forEach(img=>{const open=()=>{byId('zoom-image').src=img.src;byId('zoom-image').alt=img.alt;byId('zoom').showModal();};img.onclick=open;img.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}};});main.querySelectorAll('[data-figure]').forEach(b=>b.onclick=()=>{state.figures[b.dataset.figure]={choice:b.dataset.choice,note:byId('note-'+b.dataset.figure).value};save('figure',b.dataset.figure,b.dataset.choice);render();});main.querySelectorAll('[data-figure-note]').forEach(b=>b.onclick=()=>{const id=b.dataset.figureNote;state.figures[id]={choice:state.figures[id]?.choice??'pending',note:byId('note-'+id).value};save('figure-note',id,state.figures[id].choice);announce('Figure note saved.');});const gallery=byId('gallery');gallery.onchange=()=>byId('gallery-link').href=sourceHref(gallery.value);gallery.onchange();
}
function renderAppendix(){main.innerHTML='<p class="notice">All <strong>228 Appendix C records</strong> are indexed here, including the 190 with only one recovered version. The 38 changed groups retain every alternative printed by Prism. They are not a complete chronological edit history. Review decisions remain in “All edits”; this view supplies additional evidence.</p><div class="source-pickers"><label>Record<select id="appendix-record">'+Object.entries(DATA.appendixRecords).map(([id,r])=>'<option value="'+id+'">'+id+' · '+esc(r.location)+' · '+(DATA.appendixChangedRecords[id]?.length??1)+' version(s)</option>').join('')+'</select></label></div><div id="appendix-detail" class="stack"></div>';byId('appendix-record').onchange=()=>{const id=byId('appendix-record').value,r=DATA.appendixRecords[id],versions=DATA.appendixChangedRecords[id];byId('appendix-detail').innerHTML=versions?versions.map(v=>'<article class="panel"><span class="eyebrow">'+id+' · '+esc(v.label)+'</span><p class="meta">'+esc(v.evidence.join(' '))+'</p><pre class="prose source">'+esc(v.latex)+'</pre></article>').join(''):'<article class="panel"><h2>'+id+' · One recovered version</h2><p>Current source line '+r.line+'. This is not proof that the passage was never edited; Appendix C recovered only one version.</p><pre class="prose source">'+esc(DATA.sources.find(x=>x.id===DATA.currentArtifact).text.split('\n').slice(r.line-1,r.line+2).join('\n'))+'</pre><a href="'+sourceHref(DATA.currentArtifact)+'" target="_blank" rel="noopener">Open complete current source</a></article>';};byId('appendix-record').onchange();}
function renderCompare(){
 const options=DATA.sources.map(s=>'<option value="'+s.id+'">'+esc(s.label)+' · '+s.id.slice(0,10)+'</option>').join('');
 main.innerHTML='<p class="notice"><strong>Unfiltered version comparison.</strong> Choose any two recovered text sources or explicitly labeled PDF text extractions. Exact source includes headings, captions, metadata, references, and Appendix C when present. PDF extraction can introduce layout differences and does not recover image pixels or original LaTeX. This view does not establish chronology or authorship. Private DOCX comments are excluded.</p><div class="source-pickers"><label>Earlier / left source<select id="left-source">'+options+'</select></label><label>Later / right source<select id="right-source">'+options+'</select></label></div><div id="source-provenance" class="notice"></div><div class="tools"><button id="compare-polished">Compare earlier polished PDF with current PDF</button><button id="compare-full">Show every source difference</button><button id="compare-raw">Read full sources side by side</button><span id="compare-stats" class="small"></span></div><div id="full-diff" style="margin-top:20px"></div><details><summary>Record a review note for this comparison</summary><textarea id="version-note" aria-label="Version comparison note"></textarea><button id="save-version-note">Save comparison note</button><p class="small">Stored with both source identities. This does not accept or restore text automatically.</p></details>';
 byId('left-source').value=DATA.comparisonBaseline;byId('right-source').value='current-scientific-view';
 const sources=()=>[DATA.sources.find(s=>s.id===byId('left-source').value),DATA.sources.find(s=>s.id===byId('right-source').value)];
 byId('save-version-note').insertAdjacentHTML('afterend','<div id="version-note-history"></div>');
 const showNotes=()=>{const[a,b]=sources();const notes=state.versionNotes.filter(n=>n.left===a.id&&n.right===b.id);byId('version-note-history').innerHTML=notes.length?'<h3>Saved notes for this pair</h3>'+notes.map(n=>'<p class="meta">'+esc(n.updated)+'</p><div class="prose">'+esc(n.note)+'</div>').join(''):'<p class="small">No saved notes for this pair.</p>';};
 const provenance=()=>{byId('source-provenance').innerHTML=sources().map((s,i)=>'<div><strong>'+(i?'Right':'Left')+':</strong> '+esc(s.origin)+(s.pdfArtifact?' · '+s.pages+' pages · <a target="_blank" rel="noopener" href="'+sourceHref(s.pdfArtifact)+'">Open original PDF</a> · extracted-text SHA <code>'+s.textSha256.slice(0,16)+'…</code>':'')+'</div>').join('');};
 byId('compare-raw').onclick=()=>{const [a,b]=sources();provenance();byId('full-diff').innerHTML='<div class="comparison"><pre class="full-source">'+esc(a.text)+'</pre><pre class="full-source">'+esc(b.text)+'</pre></div>';byId('compare-stats').textContent='Every input character retained · no filtering';};
 byId('compare-full').onclick=()=>{const [a,b]=sources();provenance();const pieces=sequenceDiff(a.text.match(/[^\n]*\n|[^\n]+$/g)||[],b.text.match(/[^\n]*\n|[^\n]+$/g)||[],16000000);byId('full-diff').innerHTML='<pre class="full-source">'+pieces.map(p=>p.kind==='equal'?'<span class="equal">'+esc(p.items.join(''))+'</span>':(p.kind==='delete'?'<del>':'<ins>')+esc(p.items.join(''))+(p.kind==='delete'?'</del>':'</ins>')).join('')+'</pre>';byId('compare-stats').textContent=pieces.filter(p=>p.kind!=='equal').length+' changed blocks · all unchanged text retained';};
 const sourceChanged=()=>{byId('version-note').value='';showNotes();byId('compare-full').click();};
 byId('left-source').onchange=sourceChanged;byId('right-source').onchange=sourceChanged;
 const polished=DATA.sources.find(s=>s.pdfArtifact&&s.aliases.some(a=>a.source==='molarium_generated_infrastructure_polished.pdf'));
 byId('compare-polished').disabled=!polished;
 byId('compare-polished').onclick=()=>{if(!polished)return;byId('left-source').value=polished.id;byId('right-source').value='pdf-text:'+DATA.currentPdf.replace(/\.pdf$/,'');byId('version-note').value='';showNotes();byId('compare-raw').click();};
 byId('save-version-note').onclick=()=>{const[a,b]=sources();state.versionNotes.push({left:a.id,right:b.id,note:byId('version-note').value,updated:new Date().toISOString()});save('version-note',a.id+' → '+b.id,'note');showNotes();announce('Comparison note saved.');};showNotes();byId('compare-full').click();
}
function renderHistory(){const pdfs=DATA.history.artifacts.filter(a=>a.extension==='.pdf');main.innerHTML='<article class="panel"><div class="eyebrow">Recovery, not inferred authorship</div><h2>A larger record than Appendix C could see</h2><div class="historysummary"><p>The current source is preserved byte-for-byte. Removing only the inserted editorial appendix reconstructs the exact pre-Appendix-C SHA-256 printed by Prism: <code>'+DATA.baselineBeforeAppendixC+'</code>. Verification: <strong>'+String(DATA.appendixBaselineHashVerified)+'</strong>.</p><p>The local inventory contains '+DATA.history.artifacts.length+' unique artifacts, '+DATA.history.aliases.length+' source occurrences, and '+DATA.history.gitCommits.length+' reachable Git paper snapshots. The '+pdfs.length+' PDF artifacts include standalone figures and appendices, not just full manuscript drafts. Duplicate files are stored once by content hash.</p><p>Appendix C’s Source A is present. Its claimed Source B hash <code>bb47e79e…</code> is not in the recovered set: the same-named local ZIP contains a different snapshot, <code>d098f373…</code>. This does not prove Prism’s hash is wrong. The default comparison uses the actual local file, explicitly identified. Sources C–E survive as excerpts in Appendix C, not recovered full drafts.</p><p>The August 26 public lineage record distinguishes generated drafts, Woody’s supplied critique, human selection, and the later human-led revision phase. Metadata and filenames do not establish who wrote a sentence. Raw collaborator DOCX files and comments stay outside the public bundle pending privacy review.</p></div><div class="tools"><a href="history-2026-09-06/manifest.json">Artifact manifest</a><a href="'+sourceHref(DATA.currentArtifact)+'">Exact current LaTeX</a><a href="'+sourceHref(DATA.currentPdf)+'">Current PDF</a><a href="README.md">Review scope and method</a></div><div class="sep"></div><h3>Recovered PDF versions and figures</h3><div class="tablewrap"><table><thead><tr><th>Recovered source</th><th>Pages</th><th>Identity</th></tr></thead><tbody>'+pdfs.map(a=>{const aliases=DATA.history.aliases.filter(x=>x.artifact===a.id);return '<tr><td><a target="_blank" rel="noopener" href="'+sourceHref(a.id)+'">'+esc(aliases[0].source)+'</a><div class="small">'+aliases.length+' recorded source occurrence(s)</div></td><td>'+a.pages+'</td><td><code>'+a.sha256.slice(0,16)+'…</code></td></tr>';}).join('')+'</tbody></table></div><h3>What this does not recover</h3><p class="inline-note">Unseen Prism revisions, deleted Git objects, private model conversations, or exact individual authorship. Filesystem dates and ZIP timestamps are observations, not a proven editing sequence. The original manuscript and all recovered scientific failures remain unchanged.</p></article>';}
function markdownExcerpt(text){
 const inline=value=>esc(value).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\`([^\`]+)\`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,label,url)=>/^(https:\/\/|\.\.\/|[a-zA-Z0-9][^:]*$)/.test(url)?'<a target="_blank" rel="noopener" href="'+url+'">'+label+'</a>':m);
 return text.split(/\n\n+/).map(p=>p.startsWith('- ')?'<ul>'+p.split(/\n- /).map(x=>'<li>'+inline(x.replace(/^- /,''))+'</li>').join('')+'</ul>':'<p>'+inline(p)+'</p>').join('');
}
function renderTechnical(){
 main.innerHTML='<p class="notice">These are independent scientific/version findings, not stylistic edits. Select a proposal, keep the current text, or mark it for discussion. No numerical substitution or figure replacement is applied automatically.</p><p><a href="TECHNICAL-REVIEW-2026-09-06.md" target="_blank" rel="noopener">Complete technical audit and evidence</a></p><div class="stack">'+DATA.technicalFindings.map(f=>'<article class="panel"><span class="eyebrow">'+f.id+'</span><h2>'+esc(f.title)+'</h2><div class="inline-note">'+markdownExcerpt(f.markdown)+'</div><div class="tools">'+['propose','keep','discuss','pending'].map(c=>'<button data-technical="'+f.id+'" data-choice="'+c+'" aria-pressed="'+String(state.technical[f.id]?.choice===c&&c!=='pending')+'">'+({propose:'Propose this correction',keep:'Keep current text',discuss:'Needs discussion',pending:'Leave undecided'})[c]+'</button>').join('')+'</div><label class="small" for="tech-note-'+f.id+'">Your note</label><textarea id="tech-note-'+f.id+'" style="min-height:75px;font-size:15px">'+esc(state.technical[f.id]?.note??'')+'</textarea><button data-tech-note="'+f.id+'">Save technical note</button><p class="meta">Status: '+esc(state.technical[f.id]?.choice??'undecided')+'</p></article>').join('')+'</div>';
 main.querySelectorAll('[data-technical]').forEach(b=>b.onclick=()=>{state.technical[b.dataset.technical]={choice:b.dataset.choice,note:byId('tech-note-'+b.dataset.technical).value};save('technical',b.dataset.technical,b.dataset.choice);render();});
 main.querySelectorAll('[data-tech-note]').forEach(b=>b.onclick=()=>{const id=b.dataset.techNote;state.technical[id]={choice:state.technical[id]?.choice??'pending',note:byId('tech-note-'+id).value};save('technical-note',id,state.technical[id].choice);announce('Technical note saved.');});
}
function render(){
 const active=document.activeElement;let focusTarget=null;
 if(active&&main.contains(active)){
  if(active.id)focusTarget='#'+CSS.escape(active.id);
  else for(const attr of ['data-change','data-decision','data-suggestion','data-figure','data-technical'])if(active.hasAttribute(attr)){focusTarget='['+attr+'="'+CSS.escape(active.getAttribute(attr))+'"]';if(active.hasAttribute('data-choice'))focusTarget+='[data-choice="'+CSS.escape(active.getAttribute('data-choice'))+'"]';break;}
 }
 ({review:renderReview,suggestions:renderSuggestions,figures:renderFigures,appendix:renderAppendix,compare:renderCompare,history:renderHistory,technical:renderTechnical})[tab]();updateStatus();
 if(focusTarget)main.querySelector(focusTarget)?.focus({preventScroll:true});
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(t=>{t.classList.toggle('active',t===b);t.setAttribute('aria-current',t===b?'page':'false');});render();});
byId('export-review').onclick=()=>{const payload={...state,exportedAt:new Date().toISOString(),reviewDataId:DATA.dataId,policy:'Author decisions and proposals only. Current manuscript unchanged. Custom prose and overlapping changes require deliberate LaTeX integration and compilation.'};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)+'\n'],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='molarium-manuscript-decisions.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);announce('Decision export downloaded. No manuscript was changed.');};
byId('import-review').onclick=()=>byId('import-file').click();byId('import-file').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>5*1024*1024)throw Error('Review file exceeds 5 MiB.');const parsed=validateImport(JSON.parse(await file.text()));if(([state.decisions,state.suggestions,state.figures,state.technical].some(x=>Object.keys(x).length)||state.versionNotes.length)&&!confirm('Replace this browser’s decisions with the imported review? Export the current review first if you need both.'))return;state=parsed;save('import','review','imported');render();announce('Matching review imported.');}catch(err){announce(err.message);}finally{e.target.value='';}};
byId('close-zoom').onclick=()=>byId('zoom').close();render();if(restoreWarning)announce(restoreWarning);
</script>
