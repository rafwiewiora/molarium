<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Molarium · molecular design history</title>
  <link rel="stylesheet" href="../../docking/validation/pose-viewer/vendor/molstar-5.11.0.css">
  <script src="../../docking/validation/pose-viewer/vendor/molstar-5.11.0.js"></script>
  <style>
    :root{color-scheme:light;--ink:#132034;--muted:#687489;--line:#d8e0e8;--paper:#fff;
      --wash:#f4f7f9;--cyan:#54b8c8;--purple:#826cae;--orange:#dc8747;--green:#2c7759}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--wash);overflow:hidden}
    main{display:grid;grid-template-columns:340px minmax(0,1fr);height:100%}
    aside{position:relative;z-index:5;display:flex;flex-direction:column;background:#fffffffa;border-right:1px solid var(--line);padding:28px 26px;box-shadow:10px 0 35px #1320340c}
    .brand{font-size:11px;font-weight:850;letter-spacing:.18em;text-transform:uppercase;color:#0e5968}.brand span{color:var(--muted);font-weight:700}
    h1{font-size:28px;line-height:1.08;letter-spacing:-.035em;margin:20px 0 8px}.subtitle{font-size:14px;color:var(--muted);max-width:26ch}
    .cue-count{margin-top:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}.cue-title{font-size:22px;line-height:1.12;letter-spacing:-.025em;margin:11px 0 10px}.cue-body{font-size:15px;line-height:1.55;margin:0}.cue-detail{border-left:3px solid var(--cyan);padding-left:11px;margin-top:15px;color:var(--muted);font-size:12px}
    .controls{display:grid;grid-template-columns:38px 1fr 38px;gap:8px;align-items:center;margin-top:24px}.controls button{width:38px;height:34px;border-radius:9px;border:1px solid #c8d3df;background:#fff;color:var(--ink);font-size:20px;cursor:pointer}.controls input{width:100%;accent-color:#247d95}.sources{margin-top:18px;font-size:11px;color:var(--muted)}.sources summary{cursor:pointer;font-weight:700}.sources a{display:block;color:#3f6f82;text-decoration:none;margin-top:5px}
    #stage{position:relative;min-width:0;background:#fff;overflow:hidden}#viewer{position:absolute;inset:0}.msp-plugin{background:#fff!important}
    #boot,#error{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:#f8fafb;color:var(--muted)}#error{display:none;color:#a33b28;padding:50px;text-align:center}
    .topline{position:absolute;z-index:7;top:22px;left:24px;right:24px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.badge{border:1px solid var(--line);border-radius:999px;background:#fffffff0;box-shadow:0 5px 18px #1d2b3a12;padding:7px 11px;font-size:11px;font-weight:750}.badge.experimental{color:var(--green)}.badge.reconstructed{color:#a45c1f}
    .legend{position:absolute;z-index:7;left:24px;bottom:22px;display:flex;gap:8px;pointer-events:none}.key{border:1px solid var(--line);border-radius:999px;background:#fffffff2;box-shadow:0 5px 18px #1d2b3a12;padding:7px 10px;font-size:11px;font-weight:700}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.progress{height:3px;background:#dde5ec;position:absolute;z-index:8;left:0;right:0;bottom:0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#2b7b91,var(--cyan));width:0}
    .focus-marker{position:absolute;z-index:7;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%);border:2px solid #54b8c8cc;border-radius:50%;box-shadow:0 0 0 7px #54b8c81c;pointer-events:none}.focus-marker:before,.focus-marker:after{content:"";position:absolute;background:#54b8c8cc}.focus-marker:before{width:14px;height:2px;left:14px;top:20px}.focus-marker:after{width:2px;height:14px;left:20px;top:14px}.focus-marker span{position:absolute;left:50%;top:54px;transform:translateX(-50%);white-space:nowrap;border:1px solid #b9dfe5;border-radius:999px;background:#fffffff2;padding:5px 9px;color:#216676;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}.focus-marker[hidden]{display:none}
    body.render aside{background:#ffffffee}body.render .controls,body.render .sources{display:none}
    @media(max-width:760px){main{grid-template-columns:1fr;grid-template-rows:250px minmax(0,1fr)}aside{padding:18px 20px;border-right:0;border-bottom:1px solid var(--line)}h1{font-size:22px;margin-top:10px}.subtitle{display:none}.cue-title{font-size:18px}.cue-body{font-size:13px}.cue-count{margin-top:12px}.sources{display:none}}
  </style>
</head>
<body>
<main>
  <aside>
    <div class="brand">Molarium <span>structure story</span></div>
    <h1 id="story-title">Molecular design history</h1>
    <div class="subtitle" id="story-subtitle"></div>
    <div class="cue-count" id="cue-count">Scene</div>
    <div class="cue-title" id="cue-title"></div>
    <p class="cue-body" id="cue-body"></p>
    <div class="cue-detail" id="cue-detail"></div>
    <div class="controls">
      <button id="previous" type="button" aria-label="Previous scene">&#8249;</button>
      <input id="timeline" type="range" min="0" max="1" value="0" aria-label="Movie timeline">
      <button id="next" type="button" aria-label="Next scene">&#8250;</button>
    </div>
    <details class="sources"><summary>Structures and provenance</summary><div id="sources"></div></details>
  </aside>
  <section id="stage">
    <div id="viewer"></div><div id="boot">Loading experimental structures…</div><div id="error"></div>
    <div class="topline"><span class="badge experimental" id="coordinate-class">Experimental coordinates</span><span class="badge" id="structure-label">7GN8</span></div>
    <div class="focus-marker" id="focus-marker" hidden><span id="focus-label"></span></div>
    <div class="legend" id="legend"></div>
    <div class="progress"><i id="progress"></i></div>
  </section>
</main>
<script type="module" src="./viewer.mjs"></script>
</body>
</html>
