<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="title description">
  <title id="title">Molarium mark</title>
  <desc id="description">A molecular bond drawn as the letter M inside a rounded chamber.</desc>
