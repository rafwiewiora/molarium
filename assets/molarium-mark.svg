  <path d="M10 34V14.5L24 28l14-13.5V34" fill="none" stroke="url(#bond)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="10" cy="14.5" r="3.4" fill="#74d0ed" stroke="#10212c" stroke-width="1.4"/>
  <circle cx="24" cy="28" r="3.4" fill="#f8fbfd" stroke="#10212c" stroke-width="1.4"/>
  <circle cx="38" cy="14.5" r="3.4" fill="#91dfb8" stroke="#10212c" stroke-width="1.4"/>
  <circle cx="10" cy="34" r="2.2" fill="#d8e7ee"/>
  <circle cx="38" cy="34" r="2.2" fill="#d8e7ee"/>
