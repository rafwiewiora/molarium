    <linearGradient id="chamber" x1="5" y1="4" x2="43" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1720"/>
      <stop offset="1" stop-color="#193241"/>
    </linearGradient>
    <linearGradient id="bond" x1="9" y1="15" x2="39" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#73cce8"/>
      <stop offset=".48" stop-color="#f8fbfd"/>
